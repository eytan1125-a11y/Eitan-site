<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>ניהול · איתן שלם</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .admin { max-width: 900px; margin: 0 auto; padding: 40px 6vw 80px; }
    .admin h1 { font-family: var(--serif); color: var(--ink); margin: 0 0 6px; }
    .admin .who { color: var(--muted); margin: 0 0 28px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .panel { background: var(--white); border: 1px solid var(--line); border-radius: 16px; padding: 24px; margin-bottom: 24px; }
    .panel h2 { font-family: var(--serif); color: var(--ink); margin: 0 0 6px; font-size: 26px; }
    .panel .hint { color: var(--muted); margin: 0 0 16px; font-size: 15px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .row input { flex: 1; min-width: 180px; font: inherit; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--line-2); background: var(--cream-2); }
    .b { font: inherit; font-weight: 700; padding: 12px 22px; border-radius: 10px; border: 0; background: var(--ink); color: var(--cream); cursor: pointer; }
    .b.light { background: transparent; color: var(--ink); border: 1.5px solid var(--taupe); font-weight: 600; padding: 8px 14px; }
    ul.dates { list-style: none; padding: 0; margin: 16px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
    ul.dates li { display: flex; align-items: center; gap: 8px; background: var(--cream); border: 1px solid var(--line); border-radius: 999px; padding: 6px 8px 6px 14px; }
    ul.dates li.past { opacity: .55; }
    ul.dates button { all: unset; cursor: pointer; width: 24px; height: 24px; border-radius: 999px; text-align: center; line-height: 24px; color: #96482F; font-weight: 700; }
    ul.dates button:focus-visible { outline: 2px solid var(--accent); }
    .req { border-top: 1px solid var(--line); padding: 14px 0; display: grid; gap: 4px; }
    .req:first-of-type { border-top: 0; }
    .req .top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-weight: 700; color: var(--ink); }
    .req .msg { color: var(--body); white-space: pre-wrap; }
    .req .actions { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
    .req.handled { opacity: .55; }
    .tag { font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--sand); color: var(--ink); }
    .msgbox { padding: 16px; border-radius: 12px; background: #F6ECE6; border: 1.5px solid #E4C7B8; color: var(--ink); }
    [hidden] { display: none !important; }
  </style>
  <script type="module" src="js/admin.js"></script>
</head>
<body>
  <main class="admin">
    <h1>ניהול האתר</h1>
    <p class="who"><span id="who">טוען…</span>
      <button class="b light" id="sign-in" hidden>כניסה עם Google</button>
      <button class="b light" id="sign-out" hidden>יציאה</button>
      <a href="./" class="b light" style="text-decoration:none">לאתר</a>
    </p>

    <div class="msgbox" id="msg" hidden></div>

    <section class="panel" id="dates-panel" hidden>
      <h2>תאריכים תפוסים</h2>
      <p class="hint">גולשים רואים רק אם התאריך שבחרו פנוי או תפוס — לא את כל הרשימה.</p>
      <form class="row" id="add-date-form">
        <label for="new-date" class="visually-hidden">תאריך לסימון כתפוס</label>
        <input type="date" id="new-date" required>
        <button class="b" type="submit">סימון כתפוס</button>
      </form>
      <ul class="dates" id="dates"></ul>
    </section>

    <section class="panel" id="req-panel" hidden>
      <h2>בקשות להצעת מחיר</h2>
      <p class="hint">כל מי ששלח את הטופס באתר, גם אם לא לחץ "שלח" בוואטסאפ.</p>
      <div id="requests"></div>
    </section>
  </main>
</body>
</html>
